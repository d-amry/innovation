    --z1:#F2C230; --z2:#35C0CC; --z3:#FF8A63;
    --good:#5FD38A; --good-soft:#143324; --warn:#F2B04C; --warn-soft:#3A2D14;
    --sel:#9CC0F2; --sel-ink:#0E1626; --head-bg:#111D33; --head-ink:#E8EEF9; --focus:#7AA7FF; color-scheme:dark;
  }
}

  --bg:#0E1626; --surface:#17223A; --ink:#E8EEF9; --muted:#9DABC2; --line:#2B3A58;

  --z1:#F2C230; --z2:#35C0CC; --z3:#FF8A63;
  --good:#5FD38A; --good-soft:#143324; --warn:#F2B04C; --warn-soft:#3A2D14;

*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}

:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.hero .small{font-size:.8rem;opacity:.85}

.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}

.act{border-left:4px solid var(--z3);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;word-break:break-all;background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;padding:12px;user-select:all}
.msgbox{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.82rem;line-height:1.5;background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;padding:12px;user-select:all}
a.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none}
.btn.wa{background:#1B7F46;color:#fff}
.card.about{display:block}

.cmp{width:100%;border-collapse:collapse;font-size:.9rem}

.cmp th{font-size:.76rem;color:var(--muted);font-weight:700}
.scroll{overflow-x:auto}

.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;justify-content:center}

</style>

<script>
(function(){
'use strict';
/* ================= Data: 30 statements (2 per competence), 5 levels each, Bahasa + English ================= */
var D = {"areas": [{"id": "1", "emoji": "💡", "id_name": "Ide & Peluang", "en_name": "Ideas & Opportunities", "id_desc": "Melihat peluang, berpikir kreatif, dan menilai apakah sebuah ide layak diwujudkan.", "en_desc": "Spotting opportunities, thinking creatively, and judging whether an idea is worth pursuing."}, {"id": "2", "emoji": "🧰", "id_name": "Sumber Daya", "en_name": "Resources", "id_desc": "Mengenal diri sendiri, menjaga semangat, dan menggerakkan sumber daya, uang, serta orang lain.", "en_desc": "Knowing yourself, staying motivated, and mobilising resources, money and other people."}, {"id": "3", "emoji": "🚀", "id_name": "Beraksi", "en_name": "Into Action", "id_desc": "Memulai, merencanakan, menghadapi ketidakpastian, bekerja sama, dan belajar dari pengalaman.", "en_desc": "Starting, planning, coping with uncertainty, working with others, and learning from experience."}], "comps": [["1.1", "👀", "Mengenali Peluang", "Spotting Opportunities", "Catat 3 masalah kecil yang Anda temui hari ini.", "Note 3 small problems you come across today."], ["1.2", "🎨", "Kreativitas", "Creativity", "Tulis 10 cara baru memakai satu benda sehari-hari.", "List 10 new uses for one everyday object."], ["1.3", "🔭", "Visi", "Vision", "Selesaikan kalimat ini: \"Dalam 3 tahun, saya ingin ...\"", "Finish this sentence: \"In 3 years, I want ...\""], ["1.4", "💎", "Menilai Ide", "Valuing Ideas", "Tanyakan kepada 3 calon pengguna: \"Apakah ini berguna bagi Anda?\"", "Ask 3 likely users: \"Would this be useful to you?\""], ["1.5", "🌱", "Berpikir Etis & Berkelanjutan", "Ethical & Sustainable Thinking", "Untuk satu ide, tulis siapa yang diuntungkan dan siapa yang bisa dirugikan.", "For one idea, write who benefits and who might be harmed."], ["2.1", "🪞", "Kesadaran Diri & Keyakinan Diri", "Self-awareness & Self-efficacy", "Minta dua orang menyebutkan satu kekuatan Anda.", "Ask two people to name one of your strengths."], ["2.2", "🔥", "Motivasi & Ketekunan", "Motivation & Perseverance", "Tentukan satu target kecil minggu ini dan centang setiap hari.", "Set one small target this week and tick it off daily."], ["2.3", "🧩", "Menggerakkan Sumber Daya", "Mobilising Resources", "Buat daftar \"yang sudah saya punya\" (orang, alat, ruang) sebelum mencari yang baru.", "Make a list of \"what I already have\" (people, tools, space) before looking for more."], ["2.4", "💰", "Literasi Keuangan & Ekonomi", "Financial & Economic Literacy", "Hitung biaya satu kegiatan kecil (misalnya acara kelas) dalam tabel sederhana.", "Cost one small activity (e.g. a class event) in a simple table."], ["2.5", "📣", "Menggerakkan Orang Lain", "Mobilising Others", "Latih penjelasan ide Anda selama 60 detik kepada satu teman.", "Practise a 60-second explanation of your idea with one friend."], ["3.1", "⚡", "Berinisiatif", "Taking the Initiative", "Mulai satu hal kecil yang lama tertunda, dalam 24 jam ke depan.", "Start one small thing you have been putting off, within the next 24 hours."], ["3.2", "📋", "Perencanaan & Pengelolaan", "Planning & Management", "Pecah satu tujuan menjadi 5 langkah, masing-masing dengan tanggal.", "Break one goal into 5 steps, each with a date."], ["3.3", "🎲", "Menghadapi Ketidakpastian & Risiko", "Coping with Uncertainty, Ambiguity & Risk", "Lakukan satu percobaan kecil yang kalau gagal tidak merugikan.", "Run one small experiment where failing costs very little."], ["3.4", "🤝", "Bekerja dengan Orang Lain", "Working with Others", "Ajak satu orang dari bidang yang berbeda mengobrol 20 menit.", "Invite one person from a different field for a 20-minute chat."], ["3.5", "🔄", "Belajar dari Pengalaman", "Learning through Experience", "Setiap Jumat, tulis: \"Apa yang saya pelajari minggu ini?\"", "Every Friday, write: \"What did I learn this week?\""]], "items": [[{"se": "I can identify opportunities for creating value for different people, my community or my surroundings.", "si": "Saya bisa melihat peluang untuk menciptakan manfaat bagi orang lain, komunitas, atau lingkungan sekitar saya.", "le": ["I know opportunities exist around me, but I need help to see them.", "I am starting to notice needs around me, often when others point them out.", "I spot some opportunities myself and test whether they are worth pursuing.", "I regularly spot opportunities for others and take responsibility for acting on some.", "I find opportunities that create value for many people and help others see them."], "li": ["Saya tahu peluang itu ada di sekitar saya, tetapi saya perlu bantuan untuk melihatnya.", "Saya mulai memperhatikan kebutuhan di sekitar saya, biasanya setelah orang lain menunjukkannya.", "Saya menemukan beberapa peluang sendiri dan mencoba menguji apakah layak dikejar.", "Saya rutin melihat peluang bagi orang lain dan berani bertanggung jawab mewujudkan sebagian.", "Saya menemukan peluang yang bermanfaat bagi banyak orang dan membantu orang lain melihatnya."]}, {"se": "I can identify challenges that come from the different needs and interests of different people.", "si": "Saya bisa mengenali tantangan yang muncul karena kebutuhan dan kepentingan orang yang berbeda-beda.", "le": ["I know people want different things, but I need help to see the problems this causes.", "I am starting to see where people's needs clash, with guidance.", "I can spot clashes between people's needs, alone or with others.", "I notice these challenges early and help share the work of addressing them.", "I handle complex clashes between needs and help find balanced solutions."], "li": ["Saya tahu orang menginginkan hal berbeda, tetapi saya perlu bantuan untuk melihat masalah yang timbul.", "Saya mulai melihat di mana kebutuhan orang saling bertabrakan, dengan bimbingan.", "Saya bisa melihat benturan kebutuhan antarorang, sendiri atau bersama orang lain.", "Saya menyadari tantangan ini sejak dini dan ikut membagi kerja untuk mengatasinya.", "Saya menangani benturan kebutuhan yang rumit dan membantu menemukan solusi yang seimbang."]}], [{"se": "I can develop, lead and finish a creative process.", "si": "Saya bisa mengembangkan, memimpin, dan menyelesaikan sebuah proses kreatif.", "le": ["I am just starting and need guidance to follow a creative process.", "I join creative activities and begin to contribute, with support.", "I carry out a creative process from start to finish, alone or with a team.", "I lead a creative process through to a result and take responsibility for it.", "I lead creative processes on complex challenges and improve how others work creatively."], "li": ["Saya baru mulai dan perlu bimbingan untuk mengikuti proses kreatif.", "Saya ikut kegiatan kreatif dan mulai berkontribusi dengan dukungan orang lain.", "Saya menjalankan proses kreatif dari awal sampai akhir, sendiri atau bersama tim.", "Saya memimpin proses kreatif sampai ada hasil dan bertanggung jawab atasnya.", "Saya memimpin proses kreatif untuk tantangan yang rumit dan membantu orang lain berkreasi lebih baik."]}, {"se": "I can use several creative techniques (such as brainstorming and problem-solving methods) to create value for my community.", "si": "Saya bisa memakai beberapa teknik kreatif (misalnya curah pendapat dan metode pemecahan masalah) untuk menciptakan manfaat bagi komunitas saya.", "le": ["I have heard of creative techniques but have not used them.", "I try one or two techniques with guidance.", "I choose and use different techniques on my own to solve real problems.", "I confidently pick the right technique and use it to create value for others.", "I combine and adapt techniques, and teach others to use them."], "li": ["Saya pernah mendengar teknik kreatif, tetapi belum pernah memakainya.", "Saya mencoba satu atau dua teknik dengan bimbingan.", "Saya memilih dan memakai berbagai teknik sendiri untuk memecahkan masalah nyata.", "Saya percaya diri memilih teknik yang tepat dan memakainya untuk menciptakan manfaat bagi orang lain.", "Saya menggabungkan dan menyesuaikan teknik, serta mengajarkannya kepada orang lain."]}], [{"se": "I can change what I do to reach my goals.", "si": "Saya bisa mengubah apa yang saya lakukan untuk mencapai tujuan saya.", "le": ["I know I need goals, but I need help to adjust what I do.", "I start to change my actions when things are not working, with guidance.", "I try different actions on my own to move toward my goals.", "I regularly adjust my actions to stay on track and take responsibility for results.", "I redirect my own and others' efforts toward ambitious goals as conditions change."], "li": ["Saya tahu saya perlu tujuan, tetapi saya perlu bantuan untuk menyesuaikan tindakan saya.", "Saya mulai mengubah tindakan ketika sesuatu tidak berjalan, dengan bimbingan.", "Saya mencoba tindakan berbeda sendiri untuk mendekati tujuan saya.", "Saya rutin menyesuaikan tindakan agar tetap di jalur dan bertanggung jawab atas hasilnya.", "Saya mengarahkan ulang upaya saya dan orang lain menuju tujuan besar ketika keadaan berubah."]}, {"se": "I can explain the value of a new idea from the point of view of different people.", "si": "Saya bisa menjelaskan nilai sebuah ide baru dari sudut pandang orang yang berbeda-beda.", "le": ["I can describe an idea but need help to see it through other people's eyes.", "I am starting to ask others what they think the idea is worth.", "I can explain an idea's value to a few different kinds of people.", "I explain an idea's value convincingly to different people and adjust my message.", "I bring many people's interests together around an idea's shared value."], "li": ["Saya bisa menceritakan sebuah ide, tetapi perlu bantuan untuk melihatnya lewat mata orang lain.", "Saya mulai bertanya kepada orang lain tentang nilai ide itu menurut mereka.", "Saya bisa menjelaskan nilai sebuah ide kepada beberapa jenis orang.", "Saya menjelaskan nilai sebuah ide dengan meyakinkan kepada berbagai orang dan menyesuaikan pesan saya.", "Saya mempertemukan kepentingan banyak orang di sekitar nilai bersama dari sebuah ide."]}], [{"se": "I can decide what kind of value (cultural, social or economic) I want to create for my community.", "si": "Saya bisa menentukan jenis manfaat (budaya, sosial, atau ekonomi) yang ingin saya ciptakan bagi komunitas saya.", "le": ["I know ideas can create different kinds of value, but I need help to choose.", "I explore which kinds of value matter to my community, with guidance.", "I choose the kind of value I want to create and can explain why.", "I set clear value goals for my community and take responsibility for them.", "I create value in several ways at once and help others define theirs."], "li": ["Saya tahu ide bisa menciptakan berbagai jenis manfaat, tetapi saya perlu bantuan untuk memilih.", "Saya menjajaki jenis manfaat apa yang penting bagi komunitas saya, dengan bimbingan.", "Saya memilih jenis manfaat yang ingin saya ciptakan dan bisa menjelaskan alasannya.", "Saya menetapkan tujuan manfaat yang jelas bagi komunitas saya dan bertanggung jawab atasnya.", "Saya menciptakan beberapa jenis manfaat sekaligus dan membantu orang lain menentukan manfaat mereka."]}, {"se": "I can protect my ideas and inventions (for example with copyright or other intellectual property rights).", "si": "Saya bisa melindungi ide dan karya saya (misalnya dengan hak cipta atau hak kekayaan intelektual lainnya).", "le": ["I have heard of protecting ideas but do not know how.", "I am learning the basics of protecting ideas, with help.", "I can use basic ways to protect my own ideas.", "I know which kind of protection suits my idea and take care of it.", "I manage protection for complex ideas and advise others."], "li": ["Saya pernah mendengar tentang perlindungan ide, tetapi belum tahu caranya.", "Saya sedang belajar dasar-dasar melindungi ide, dengan bantuan.", "Saya bisa memakai cara-cara dasar untuk melindungi ide saya sendiri.", "Saya tahu jenis perlindungan yang cocok untuk ide saya dan mengurusnya.", "Saya mengelola perlindungan untuk ide yang kompleks dan menasihati orang lain."]}], [{"se": "I can behave ethically and responsibly, both as a consumer and when producing things.", "si": "Saya bisa bersikap etis dan bertanggung jawab, baik sebagai konsumen maupun saat membuat atau menghasilkan sesuatu.", "le": ["I know ethics matter, but I need guidance to apply them to daily choices.", "I am starting to consider the effect of my choices on others, with guidance.", "I try to make ethical choices on my own, as a consumer and as a producer.", "I consistently act responsibly and take responsibility for my choices.", "I set an example of ethical and responsible practice and influence others."], "li": ["Saya tahu etika itu penting, tetapi saya perlu bimbingan untuk menerapkannya dalam pilihan sehari-hari.", "Saya mulai mempertimbangkan dampak pilihan saya bagi orang lain, dengan bimbingan.", "Saya berusaha membuat pilihan etis sendiri, sebagai konsumen maupun pembuat.", "Saya konsisten bertindak bertanggung jawab dan menanggung pilihan saya.", "Saya menjadi teladan praktik etis dan bertanggung jawab serta memengaruhi orang lain."]}, {"se": "I can assess the impact and effectiveness of my own actions from an ethical point of view.", "si": "Saya bisa menilai dampak dan efektivitas tindakan saya sendiri dari sudut pandang etika.", "le": ["I need help to see how my actions affect other people.", "I begin to reflect on the effects of my actions, with support.", "I assess the ethical effects of my own actions by myself.", "I regularly check whether my actions are ethical and effective, and improve them.", "I evaluate complex impacts and help others judge theirs."], "li": ["Saya perlu bantuan untuk melihat bagaimana tindakan saya memengaruhi orang lain.", "Saya mulai merenungkan dampak tindakan saya, dengan dukungan.", "Saya menilai dampak etis dari tindakan saya sendiri.", "Saya rutin memeriksa apakah tindakan saya etis dan efektif, lalu memperbaikinya.", "Saya menilai dampak yang rumit dan membantu orang lain menilai dampak mereka."]}], [{"se": "I can identify my needs, my wants and the areas I need to develop.", "si": "Saya bisa mengenali kebutuhan, keinginan, dan hal-hal yang perlu saya kembangkan.", "le": ["I need help to see what I need or want to develop.", "I can name some strengths and gaps, usually after feedback from others.", "I identify my needs and development areas on my own.", "I know my needs and gaps well and act on them.", "I track my growth over time and help others do the same."], "li": ["Saya perlu bantuan untuk melihat apa yang saya butuhkan atau ingin kembangkan.", "Saya bisa menyebut beberapa kekuatan dan kekurangan saya, biasanya setelah mendapat masukan.", "Saya mengenali kebutuhan dan hal yang perlu dikembangkan dari diri saya sendiri.", "Saya mengenal kebutuhan dan kekurangan saya dengan baik dan bertindak berdasarkan itu.", "Saya memantau perkembangan diri dari waktu ke waktu dan membantu orang lain melakukannya."]}, {"se": "I believe I can influence people and situations through my own actions.", "si": "Saya percaya saya bisa memengaruhi orang dan keadaan lewat tindakan saya sendiri.", "le": ["I am not sure my actions make a difference.", "I am starting to see that my actions can change small things.", "I believe my actions can influence people around me, and I test this.", "I am confident my actions make a difference and I act on that.", "I influence people and situations with confidence, even under difficult conditions."], "li": ["Saya belum yakin tindakan saya membawa perbedaan.", "Saya mulai melihat bahwa tindakan saya bisa mengubah hal-hal kecil.", "Saya percaya tindakan saya bisa memengaruhi orang di sekitar saya, dan saya mengujinya.", "Saya yakin tindakan saya membawa perbedaan dan saya bertindak berdasarkan keyakinan itu.", "Saya percaya diri memengaruhi orang dan keadaan, bahkan dalam kondisi sulit."]}], [{"se": "I can identify the inner and outer factors that motivate me to create value for others (social, cultural or economic).", "si": "Saya bisa mengenali hal-hal dari dalam dan luar diri yang memotivasi saya menciptakan manfaat bagi orang lain (sosial, budaya, atau ekonomi).", "le": ["I need help to understand what motivates me.", "I can name a few things that motivate me when prompted.", "I know several things that motivate me and how they link to creating value.", "I understand my motivation well and use it to keep creating value for others.", "I use my motivation to inspire others and sustain long-term value creation."], "li": ["Saya perlu bantuan untuk memahami apa yang memotivasi saya.", "Saya bisa menyebut beberapa hal yang memotivasi saya jika diberi pancingan.", "Saya tahu beberapa hal yang memotivasi saya dan kaitannya dengan menciptakan manfaat.", "Saya memahami motivasi saya dengan baik dan memakainya untuk terus menciptakan manfaat bagi orang lain.", "Saya memakai motivasi saya untuk menginspirasi orang lain dan menjaga manfaat jangka panjang."]}, {"se": "I can keep going in all situations, even when facing difficulties.", "si": "Saya bisa terus melangkah dalam situasi apa pun, termasuk saat menghadapi kesulitan.", "le": ["I tend to stop when things get hard unless someone supports me.", "I keep trying for a while with encouragement from others.", "I usually carry on through difficulties on my own.", "I persist through setbacks and help my team keep going.", "I stay resilient under heavy pressure and help others recover from failure."], "li": ["Saya cenderung berhenti ketika keadaan sulit, kecuali ada yang mendukung saya.", "Saya terus mencoba beberapa saat jika diberi semangat oleh orang lain.", "Saya biasanya melanjutkan walaupun sulit, tanpa harus didorong.", "Saya bertahan melewati kegagalan dan membantu tim saya tetap berjalan.", "Saya tetap tangguh di bawah tekanan berat dan membantu orang lain bangkit dari kegagalan."]}], [{"se": "I can get and manage the different resources (such as materials, money or people's time) needed to turn my ideas into action.", "si": "Saya bisa mendapatkan dan mengelola berbagai sumber daya (seperti bahan, uang, atau waktu orang lain) yang dibutuhkan untuk mewujudkan ide saya.", "le": ["I know ideas need resources, but I need help to identify them.", "I list what I need and get help to find it.", "I find and manage some resources myself for a small activity.", "I get and manage the resources my activity needs, and answer for how they are used.", "I mobilise and manage resources for large or complex activities."], "li": ["Saya tahu ide butuh sumber daya, tetapi saya perlu bantuan untuk menentukannya.", "Saya mendaftar apa yang saya butuhkan dan dibantu mencarinya.", "Saya menemukan dan mengelola beberapa sumber daya sendiri untuk kegiatan kecil.", "Saya mendapatkan dan mengelola sumber daya yang dibutuhkan kegiatan saya dan bertanggung jawab atas pemakaiannya.", "Saya menggerakkan dan mengelola sumber daya untuk kegiatan besar atau rumit."]}, {"se": "I can use public and private services (such as advisers, consultants, or peer and mentor support) to turn my idea into action.", "si": "Saya bisa memanfaatkan layanan publik dan swasta (seperti penasihat, konsultan, atau dukungan teman sebaya dan mentor) untuk mewujudkan ide saya.", "le": ["I do not know what support is available.", "I know some sources of support and ask for help when guided.", "I seek out advisers, mentors or services on my own.", "I use the right support for each stage of my idea.", "I build lasting partnerships with services and mentors and connect others to them."], "li": ["Saya belum tahu dukungan apa saja yang tersedia.", "Saya tahu beberapa sumber dukungan dan meminta bantuan saat diarahkan.", "Saya mencari penasihat, mentor, atau layanan sendiri.", "Saya memakai dukungan yang tepat untuk setiap tahap ide saya.", "Saya membangun kemitraan jangka panjang dengan layanan dan mentor serta menghubungkan orang lain dengannya."]}], [{"se": "I can estimate and calculate the cost of turning my idea into an activity.", "si": "Saya bisa memperkirakan dan menghitung biaya untuk mewujudkan ide saya menjadi sebuah kegiatan.", "le": ["I need help to work out what an idea would cost.", "I list costs with guidance.", "I estimate the main costs of a small activity on my own.", "I calculate realistic costs for my activity and take responsibility for the budget.", "I forecast costs for complex activities and test different scenarios."], "li": ["Saya perlu bantuan untuk menghitung berapa biaya sebuah ide.", "Saya mendaftar biaya dengan bimbingan.", "Saya memperkirakan biaya utama sebuah kegiatan kecil sendiri.", "Saya menghitung biaya yang realistis untuk kegiatan saya dan bertanggung jawab atas anggarannya.", "Saya memperkirakan biaya kegiatan yang rumit dan menguji berbagai skenario."]}, {"se": "I can estimate how my financial decisions (such as investing or buying assets and goods) affect my overall finances.", "si": "Saya bisa memperkirakan bagaimana keputusan keuangan saya (seperti berinvestasi atau membeli aset dan barang) memengaruhi keuangan saya secara keseluruhan.", "le": ["I need help to see how one financial decision affects the rest.", "I think about the effects of simple financial decisions, with support.", "I estimate the effects of my financial decisions on my overall situation.", "I weigh financial decisions against my overall finances before acting.", "I plan financial decisions over the long term and help others do the same."], "li": ["Saya perlu bantuan untuk melihat bagaimana satu keputusan keuangan memengaruhi hal lainnya.", "Saya memikirkan dampak keputusan keuangan sederhana, dengan dukungan.", "Saya memperkirakan dampak keputusan keuangan terhadap keadaan keuangan saya secara keseluruhan.", "Saya menimbang keputusan keuangan terhadap keuangan saya secara keseluruhan sebelum bertindak.", "Saya merencanakan keputusan keuangan jangka panjang dan membantu orang lain melakukannya."]}], [{"se": "I can lead by example.", "si": "Saya bisa memimpin lewat teladan.", "le": ["I am learning what leading by example means and need guidance.", "I sometimes show others what to do, with encouragement.", "I try to lead by example in my group.", "I lead by example and others follow my lead.", "I inspire and develop other leaders, and my example shapes my group's culture."], "li": ["Saya sedang belajar apa artinya memimpin lewat teladan dan perlu bimbingan.", "Kadang saya menunjukkan kepada orang lain apa yang harus dilakukan, dengan dorongan.", "Saya berusaha memberi teladan di kelompok saya.", "Saya memimpin lewat teladan dan orang lain mengikuti.", "Saya menginspirasi dan menumbuhkan pemimpin lain, dan teladan saya membentuk budaya kelompok."]}, {"se": "I can pitch effectively to partners, networks, supporters, investors, the media and other stakeholders.", "si": "Saya bisa mempresentasikan ide secara efektif kepada mitra, jaringan, pendukung, investor, media, dan pihak berkepentingan lainnya.", "le": ["I have never pitched and need help to explain my idea.", "I explain my idea to friends or classmates, with guidance.", "I prepare and give a short pitch on my own.", "I pitch convincingly to people whose support I need, and adjust to my audience.", "I pitch to large or sceptical audiences and win real commitment."], "li": ["Saya belum pernah mempresentasikan ide dan perlu bantuan untuk menjelaskannya.", "Saya menjelaskan ide saya kepada teman atau teman sekelas, dengan bimbingan.", "Saya menyiapkan dan membawakan presentasi singkat sendiri.", "Saya mempresentasikan ide dengan meyakinkan kepada orang yang dukungannya saya perlukan, sesuai audiensnya.", "Saya mempresentasikan ide kepada audiens besar atau skeptis dan memperoleh komitmen nyata."]}], [{"se": "I can solve problems in my group (my class, team, workplace or community).", "si": "Saya bisa memecahkan masalah di kelompok saya (kelas, tim, tempat kerja, atau komunitas).", "le": ["I know my group has problems, but I need help to recognise them.", "I am starting to spot problems and rely on others to help me understand them.", "I identify some problems and work on solving them, alone or with others.", "I recognise and solve problems in my group, working with others where needed.", "I take responsibility for finding and fixing problems, including complex ones."], "li": ["Saya tahu kelompok saya punya masalah, tetapi saya perlu bantuan untuk mengenalinya.", "Saya mulai melihat masalah dan masih bergantung pada orang lain untuk memahaminya.", "Saya mengenali beberapa masalah dan mengerjakan solusinya, sendiri atau bersama orang lain.", "Saya mengenali dan memecahkan masalah di kelompok saya, bekerja sama bila perlu.", "Saya bertanggung jawab menemukan dan memperbaiki masalah, termasuk yang rumit."]}, {"se": "I can start activities that matter for the goals of my group.", "si": "Saya bisa memulai kegiatan yang penting bagi tujuan kelompok saya.", "le": ["I know my group wants to do important things, but I need help to get started.", "I start simple activities with guidance from others.", "I start activities that matter for my group, alone or with others.", "I regularly start valuable activities and make sure they fit our goals.", "I launch complex projects and drive them to success."], "li": ["Saya tahu kelompok saya ingin melakukan hal penting, tetapi saya perlu bantuan untuk memulai.", "Saya memulai kegiatan sederhana dengan bimbingan orang lain.", "Saya memulai kegiatan yang penting bagi kelompok saya, sendiri atau bersama orang lain.", "Saya rutin memulai kegiatan bermanfaat dan memastikannya sesuai tujuan kami.", "Saya meluncurkan proyek yang rumit dan mengantarkannya sampai berhasil."]}], [{"se": "I can make an action plan with the most important steps to reach my goals.", "si": "Saya bisa menyusun rencana aksi dengan langkah-langkah terpenting untuk mencapai tujuan saya.", "le": ["I need help to break a goal into steps.", "I make simple plans with guidance.", "I write my own action plan with the main steps.", "I make realistic plans, prioritise the key steps and follow them through.", "I plan complex projects and coordinate other people's steps."], "li": ["Saya perlu bantuan untuk memecah tujuan menjadi langkah-langkah.", "Saya membuat rencana sederhana dengan bimbingan.", "Saya menulis rencana aksi sendiri dengan langkah-langkah utamanya.", "Saya membuat rencana yang realistis, memprioritaskan langkah kunci, dan menjalankannya sampai selesai.", "Saya merencanakan proyek yang rumit dan mengoordinasikan langkah orang lain."]}, {"se": "I can change my priorities when conditions change.", "si": "Saya bisa mengubah prioritas saat keadaan berubah.", "le": ["When things change I need help to know what to do first.", "I adjust my plans when someone helps me see the change.", "I reorder my priorities on my own when something changes.", "I adapt plans quickly when conditions change and keep things moving.", "I redirect plans in fast-changing conditions and guide others through the change."], "li": ["Saat keadaan berubah, saya perlu bantuan untuk tahu apa yang harus didahulukan.", "Saya menyesuaikan rencana ketika ada yang membantu saya melihat perubahannya.", "Saya menata ulang prioritas sendiri saat ada yang berubah.", "Saya cepat menyesuaikan rencana saat keadaan berubah dan menjaga pekerjaan tetap berjalan.", "Saya mengarahkan ulang rencana di situasi yang cepat berubah dan membimbing orang lain melewati perubahan itu."]}], [{"se": "I am not afraid of trying new things.", "si": "Saya tidak takut mencoba hal-hal baru.", "le": ["New things feel uncomfortable and I prefer familiar ways.", "I try new things when others encourage me.", "I try new things on my own and learn from the results.", "I am comfortable trying new things and take responsibility for the outcome.", "I seek out unfamiliar challenges and encourage others to try them."], "li": ["Hal baru terasa tidak nyaman dan saya lebih suka cara yang sudah biasa.", "Saya mencoba hal baru jika orang lain menyemangati saya.", "Saya mencoba hal baru sendiri dan belajar dari hasilnya.", "Saya nyaman mencoba hal baru dan bertanggung jawab atas hasilnya.", "Saya mencari tantangan yang belum dikenal dan mendorong orang lain untuk mencobanya."]}, {"se": "I can make choices, assess risks and decide in uncertain situations.", "si": "Saya bisa memilih, menilai risiko, dan mengambil keputusan dalam situasi yang tidak pasti.", "le": ["I find it hard to decide when things are uncertain.", "I decide with support when information is missing.", "I make decisions in uncertain situations myself and learn from them.", "I make considered decisions with incomplete information and stand by them.", "I lead decisions in very uncertain situations, balancing risk and opportunity."], "li": ["Saya sulit memutuskan ketika keadaan tidak pasti.", "Saya memutuskan dengan dukungan ketika informasi kurang.", "Saya mengambil keputusan sendiri dalam situasi tidak pasti dan belajar darinya.", "Saya membuat keputusan yang matang dengan informasi terbatas dan berdiri di belakangnya.", "Saya memimpin pengambilan keputusan dalam situasi yang sangat tidak pasti, menyeimbangkan risiko dan peluang."]}], [{"se": "I can develop ideas together with different kinds of people and teams.", "si": "Saya bisa mengembangkan ide bersama berbagai macam orang dan tim.", "le": ["I prefer to work alone, or I need help to work with new people.", "I contribute ideas in a team, with guidance.", "I develop ideas with people from different backgrounds, on my own initiative.", "I work well with a variety of people and teams to develop ideas.", "I bring diverse people together to develop ideas on a larger scale."], "li": ["Saya lebih suka bekerja sendiri, atau perlu bantuan untuk bekerja dengan orang baru.", "Saya menyumbang ide dalam tim, dengan bimbingan.", "Saya mengembangkan ide bersama orang dari latar belakang berbeda atas inisiatif sendiri.", "Saya bekerja dengan baik bersama berbagai orang dan tim untuk mengembangkan ide.", "Saya mempertemukan beragam orang untuk mengembangkan ide dalam skala yang lebih besar."]}, {"se": "I can work through disagreements and share tasks fairly in /* ================= Scoring: every statement is a level 1..5; competence = mean of its 2 statements ================= */
function mean(a){ return a.length? a.reduce(function(x,y){return x+y;},0)/a.length : 0; }
function scores(a){ var c=[],k; for(k=0;k<15;k++){ c.push((a[NI*k]+a[NI*k+1])/2); }
  var z=[0,1,2].map(function(i){ return mean(c.slice(5*i,5*i+5)); });
  return {c:c,z:z,t:mean(c)}; }
function lvlIdx(avg){ return Math.min(4,Math.max(0,Math.floor(avg+0.5+1e-9)-1)); }
function f1(x){ return (Math.round(x*10)/10).toFixed(1); }
function f2(x){ return (Math.round(x*100)/100).toFixed(2); }
function ranks(c){ var o=c.map(function(s,i){return {i:i,key:s+(100-i)/100000};}).sort(function(a,b){return b.key-a.key;}); var r=[]; o.forEach(function(x,n){ r[x.i]=n+1; }); return r; }
/* 'up' = one of the 3 strongest and at or above your own average; 'dn' = one of the 3 lowest and at or below it; nothing if the profile is flat */
function tagsFor(sc){ var rk=ranks(sc.c), mn=Math.min.apply(null,sc.c), mx=Math.max.apply(null,sc.c);
  return sc.c.map(function(s,i){ if(mx===mn) return ''; if(rk[i]<=3 && s>=sc.t) return 'up'; if(rk[i]>=13 && s<=sc.t) return 'dn'; return ''; }); }
function answered(a){ return a.filter(function(v){return v>0;}).length; }

/* ================= Name and result message ================= */
var RX=(function(){ try{ return {m:new RegExp('\\p{M}','gu'), n:new RegExp('[^\\p{L}\\p{N}]','gu')}; }catch(e){ return {m:/[\u0300-\u036f]/g, n:/[^a-z0-9]/g}; } })();
/* Matching key: same person if the key is the same. Ignores capitals, spaces, punctuation and accents. */
function nkey(name){ var s=String(name||''); try{ s=s.normalize('NFD'); }catch(e){} return s.replace(RX.m,'').toLowerCase().replace(RX.n,''); }
function cleanName(t){ return String(t||'').replace(/[|\r\n\t]/g,' ').replace(/\s+/g,' ').trim().slice(0,24); }
function chk(a){ var s=0; a.forEach(function(v,i){ s+=v*(i+1); }); return (s%36).toString(36).toUpperCase(); }
/* Machine line inside the WhatsApp message: EC3|name|role|round|YYMMDD|30 levels (1-5)|check */
function encode(st){ var d=st.date?st.date.replace(/-/g,'').slice(2):'000000'; return ['EC3',cleanName(st.name),st.role,st.round,d,st.answers.join(''),chk(st.answers)].join('|'); }
var DEC=/EC3\|([^|\r\n]{1,24})\|([SLO])\|([BA])\|(\d{6})\|([1-5]{30})\|([0-9A-Z])/i;
function decode(text){
  var raw=String(text||''), m=DEC.exec(raw);
  if(!m){ var s2=raw.replace(/\s*\|\s*/g,'|').replace(/(\d)[ \t\r\n]+(?=[\d|])/g,'$1'); m=DEC.exec(s2); }
  if(!m) return {ok:false,why:'format'};
  var name=cleanName(m[1]), a=m[5].split('').map(Number);
  if(!nkey(name)) return {ok:false,why:'format'};
  if(chk(a)!==m[6].toUpperCase()) return {ok:false,why:'checksum',name:name};
  var d=m[4]==='000000'?'':'20'+m[4].slice(0,2)+'-'+m[4].slice(2,4)+'-'+m[4].slice(4,6);
  return {ok:true,name:name,key:nkey(name),role:m[2].toUpperCase(),round:m[3].toUpperCase(),date:d,answers:a};
}
function savedNames(round){ var h=hist(), seen={}, out=[], k; for(k in h){ var d=decode(h[k]); if(d.ok && (!round||d.round===round) && !seen[d.key]){ seen[d.key]=1; out.push(d.name); } } return out; }

/* ================= Radar (levels 1 to 5) ================= */
function radar(series){
  var cx=180, cy=180, R=104, n=15, out='<svg class="radar" viewBox="0 0 360 360" role="img" aria-label="Radar">';
  function pt(k,r){ var a=(-90+k*24)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
  [1,2,3,4,5].forEach(function(v){ var p=[],k; for(k=0;k<n;k++){ p.push(pt(k,R*v/5).map(function(x){return x.toFixed(1);}).join(',')); } out+='<polygon points="'+p.join(' ')+'" fill="none" stroke="var(--line)" stroke-width="'+(v===5?1.5:1)+'"/>'; });
  var k; for(k=0;k<n;k++){ var e=pt(k,R); out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'; }
  series.forEach(function(s){ var p=s.vals.map(function(v,i){ return pt(i,R*v/5).map(function(x){return x.toFixed(1);}).join(','); });
    out+='<polygon points="'+p.join(' ')+'" fill="'+(s.fill||'none')+'" fill-opacity="'+(s.fo||0)+'" stroke="'+s.stroke+'" stroke-width="'+(s.w||2.5)+'" '+(s.dash?'stroke-dasharray="6 4" ':'')+'stroke-linejoin="round"/>';
    if(!s.dash){ s.vals.forEach(function(v,i){ var q=pt(i,R*v/5); out+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.5" fill="'+s.stroke+'"/>'; }); } });
  for(k=0;k<n;k++){ var l=pt(k,R+22); out+='<text x="'+l[0].toFixed(1)+'" y="'+(l[1]-1).toFixed(1)+'" font-size="15" text-anchor="middle" dominant-baseline="middle" style="fill:initial">'+COMPS[k][1]+'</text><text x="'+l[0].toFixed(1)+'" y="'+(l[1]+13).toFixed(1)+'" font-size="9" text-anchor="middle" dominant-baseline="middle">'+COMPS[k][0]+'</text>'; }
  [1,3,5].forEach(function(v){ var q=pt(0,R*v/5); out+='<text x="'+(q[0]+4).toFixed(1)+'" y="'+(q[1]+3).toFixed(1)+'" font-size="8">'+v+'</text>'; });
  return out+'</svg>';
}

var FAC={text:'',alias:'',res:null,roleLabels:'id'};
function lev(a,b){ var m=a.length,n=b.length,d=[],i,j; for(i=0;i<=m;i++){ d[i]=[i]; } for(j=1;j<=n;j++){ d[0][j]=j; }
  for(i=1;i<=m;i++){ for(j=1;j<=n;j++){ d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1)); } } return d[m][n]; }
function similar(a,b){ if(Math.min(a.length,b.length)>=3 && (a.indexOf(b)===0||b.indexOf(a)===0)) return true; return a.length>=4 && b.length>=4 && lev(a,b)<=1; }
function aliasMap(text){ var m={}; String(text||'').split(/\r?\n/).forEach(function(ln){ var p=ln.split('='); if(p.length===2){ var l=nkey(p[0]), r=nkey(p[1]); if(l&&r&&l!==r) m[l]=r; } }); return m; }
function parseCodes(text,aliasText){
  var amap=aliasMap(aliasText), idx=[], re=/EC3\s*\|/gi, m, good={}, bad=[], dup=[], B=[], A=[], k, canon={};
  while((m=re.exec(text))){ idx.push(m.index); }
  idx.forEach(function(p,n){ var seg=text.slice(p, n+1<idx.length?idx[n+1]:text.length).slice(0,320), d=decode(seg);
    if(!d.ok){ bad.push('Entry '+(n+1)+(d.name?' ('+d.name+')':'')+': '+(d.why==='checksum'?'checksum mismatch (typo in the code?)':'not readable')); return; }
    d.key=amap[d.key]||d.key; var gk=d.key+'|'+d.round;
    if(good[gk] && good[gk].answers.join('')!==d.answers.join('')) dup.push(d.name+' ('+ROUND[d.round][1]+')');
    good[gk]=d; });
  for(k in good){ (good[k].round==='B'?B:A).push(good[k]); }
  B.forEach(function(x){ canon[x.key]=x.name; }); A.forEach(function(x){ if(!canon[x.key]) canon[x.key]=x.name; });
  B.concat(A).forEach(function(x){ x.cname=canon[x.key]; });
  return {B:B,A:A,bad:bad,dup:dup,n:idx.length};
}
function fac(){
  var h='<div class="card fac"><h2>Facilitator</h2><p class="muted">Paste the WhatsApp messages from students (select several messages in WhatsApp and copy them, or paste them one after another). The app reads every line that starts with EC3|. Nothing leaves this page.</p>'
   +'<textarea id="factext" rows="6" placeholder="EC3|Budi S|S|B|261116|…">'+esc(FAC.text)+'</textarea>'
   +'<div class="field"><label for="facalias">Same person, different spelling (optional)</label><textarea id="facalias" rows="2" placeholder="Budi = Budi S">'+esc(FAC.alias)+'</textarea><div class="hint">One pair per line. Names are matched ignoring capitals, spaces, punctuation and accents.</div></div>'
   +'<div class="field"><span class="lab">Role labels in the output</span><div class="chips"><button class="chip" data-a="facrole" data-v="id" aria-pressed="'+(FAC.roleLabels==='id')+'">Mahasiswa / Dosen / Lainnya</button><button class="chip" data-a="facrole" data-v="en" aria-pressed="'+(FAC.roleLabels==='en')+'">Student / Lecturer / Other</button></div></div>'
   +'<button class="btn" data-a="facrun">Analyse</button><button class="btn alt" data-a="gotoWelcome">Back to the app</button></div>';
  if(FAC.res){ var r=FAC.res, P=[], Ak={}, Bk={};
    r.A.forEach(function(x){ Ak[x.key]=x; }); r.B.forEach(function(x){ Bk[x.key]=x; });
    r.B.forEach(function(b){ if(Ak[b.key]) P.push([b,Ak[b.key]]); });
    var ub=r.B.filter(function(x){return !Ak[x.key];}), ua=r.A.filter(function(x){return !Bk[x.key];}), hints=[];
    ub.forEach(function(b){ ua.forEach(function(a){ if(similar(b.key,a.key)) hints.push(b.name+' = '+a.name); }); });
    h+='<div class="card fac"><h3>Summary</h3><p>Before: <b>'+r.B.length+'</b> · After: <b>'+r.A.length+'</b> · Paired: <b>'+P.length+'</b>'+(r.bad.length?' · <span class="err">'+r.bad.length+' not read</span>':'')+'</p>'
     +(r.bad.length?'<pre class="out">'+esc(r.bad.join('\n'))+'</pre>':'')
     +(r.dup.length?'<p class="err">Same name, different answers in the same round (latest kept): '+esc(r.dup.join(', '))+'. Ask them to add an initial to their name.</p>':'');
    [['Before',r.B],['After',r.A]].forEach(function(g){ if(g[1].length){ var tots=g[1].map(function(x){return scores(x.answers).t;}); h+='<p>'+g[0]+' mean level: <b>'+f2(mean(tots))+'</b> / 5 · '+['S','L','O'].map(function(k){ var n=g[1].filter(function(x){return x.role===k;}).length; return ROLE[k][1]+' '+n; }).join(', ')+'</p>'; } });
    if(P.length){ var ch=P.map(function(p){return scores(p[1].answers).t-scores(p[0].answers).t;});
      h+='<h3>Paired change (n='+P.length+')</h3><p>Mean change in overall level: <b>'+(mean(ch)>0?'+':'')+f2(mean(ch))+'</b> · improved: '+ch.filter(function(x){return x>0.001;}).length+', same: '+ch.filter(function(x){return Math.abs(x)<=0.001;}).length+', lower: '+ch.filter(function(x){return x<-0.001;}).length+'</p>'
       +'<div class="scroll"><table class="cmp"><thead><tr><th>Competence</th><th>Before</th><th>After</th><th>Δ</th></tr></thead><tbody>'
       +COMPS.map(function(c,i){ var b=mean(P.map(function(p){return scores(p[0].answers).c[i];})), a=mean(P.map(function(p){return scores(p[1].answers).c[i];})), d=a-b; return '<tr><td>'+c[1]+' '+c[0]+' '+esc(c[3])+'</td><td>'+f2(b)+'</td><td>'+f2(a)+'</td><td><b style="color:'+(d>0?'var(--good)':d<0?'var(--warn)':'var(--muted)')+'">'+(d>0?'+':'')+f2(d)+'</b></td></tr>'; }).join('')
       +'</tbody></table></div><p class="hint">Means of levels 1–5 per competence.</p>'; }
    h+='</div>';
    if(ub.length||ua.length){
      h+='<div class="card fac"><h3>Not paired yet</h3>'
       +(ub.length?'<p><b>Before only (' + ub.length + '):</b> '+esc(ub.map(function(x){return x.name;}).join(', '))+'</p>':'')
       +(ua.length?'<p><b>After only (' + ua.length + '):</b> '+esc(ua.map(function(x){return x.name;}).join(', '))+'</p>':'')
       +(hints.length?'<p class="hint">These look like the same person. Copy the lines into “Same person, different spelling” above and press Analyse:</p><pre class="out">'+esc(hints.join('\n'))+'</pre>':'<p class="hint">If two of these are the same person written differently, add a line such as Budi = Budi S in the box above and press Analyse.</p>')
       +'</div>'; }
    function role(x){ return FAC.roleLabels==='id'?ROLE[x.role][0]:ROLE[x.role][1]; }
    function tsv(list){ return list.map(function(x){ return [x.cname,role(x),ddmmyyyy(x.date),''].concat(x.answers).join('\t'); }).join('\n'); }
    function tsvScores(){ var head=['Name','Role','Round','Date','Overall'].concat(COMPS.map(function(c){return c[0]+' '+c[3];})).join('\t');
      return head+'\n'+r.B.concat(r.A).map(function(x){ var s=scores(x.answers); return [x.cname,role(x),x.round==='B'?'Before':'After',ddmmyyyy(x.date),f2(s.t)].concat(s.c.map(f2)).join('\t'); }).join('\n'); }
    if(r.B.length||r.A.length){
      h+='<div class="card fac"><h3>Per-person scores (all rounds)</h3><p class="hint">Name, role, round, date, overall level, then the mean level (1–5) of each competence. Copy and paste into Excel or SPSS.</p><textarea id="tsvS" rows="5" readonly style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;white-space:pre">'+esc(tsvScores())+'</textarea><button class="btn small" data-a="copy" data-t="tsvS">Copy scores</button></div>'; }
    [['Before','B'],['After','A']].forEach(function(g){ var list=r[g[1]]; if(!list.length) return; var id='tsv'+g[1];
      h+='<div class="card fac"><h3>'+g[0]+': raw answers</h3><p class="hint">Columns: Name, Role, Date, (blank), then the level (1–5) of statements S1–S30.</p><textarea id="'+id+'" rows="4" readonly style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;white-space:pre">'+esc(tsv(list))+'</textarea><button class="btn small" data-a="copy" data-t="'+id+'">Copy '+g[0]+' rows</button></div>'; });
  }
  return h;
}

/* ================= Render ================= */
function render(){
  var root=document.getElementById('root'), body;
  if(S.screen==='welcome') body=welcome(); else if(S.screen==='questions') body=questions(); else if(S.screen==='results') body=results(); else if(S.screen==='open') body=openScreen(); else body=fac();
  var split = body.indexOf('<div class="bottom"');
  var main = split>=0 ? body.slice(0,split) : body, bottom = split>=0 ? body.slice(split) : '';
  root.innerHTML = header()+'<main class="wrap lang-'+S.lang+'">'+main+'</main>'+bottom;
  document.documentElement.lang = S.lang==='en'?'en':'id';
}
function go(screen){ S.screen=screen; save(); render(); window.scrollTo(0,0); }

/* ================= Actions ================= */
function flash(btn,txt){ var o=btn.innerHTML; btn.textContent=txt; setTimeout(function(){ btn.innerHTML=o; },1600); }
function copyFrom(btn){
  var el=document.getElementById(btn.getAttribute('data-t')); if(!el) return;
  var text = el.value!==undefined ? el.value : el.textContent;
  function fallback(){ try{ if(el.select){ el.focus(); el.select(); } else { var r=document.createRange(); r.selectNodeContents(el); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); } flash(btn,one('Pilih & salin secara manual','Selected: press copy')); }catch(e){} }
  try{ navigator.clipboard.writeText(text).then(function(){ flash(btn,one('Tersalin ✔','Copied ✔')); },fallback); }catch(e){ fallback(); }
}
function finish(){ S.date=S.date||today(); histSet(nkey(S.name)+'|'+S.round, encode(S)); S.cmp=null; S.cmpMsg=''; S.cmpText=''; go('results'); }
function codeErr(d){ return d.why==='checksum'?one('Kode tidak valid (ada salah ketik?).','That code does not check out (a typo?).'):one('Pesan tidak dikenali. Tempel seluruh pesan, atau baris yang diawali EC3|.','Not recognised. Paste the whole message, or the line that starts with EC3|.'); }

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]'); if(!t) return; var a=t.getAttribute('data-a'), v=t.getAttribute('data-v');
  if(a==='lang'){ S.lang=v; save(); render(); }
  else if(a==='role'){ S.role=v; S.err=''; save(); render(); }
  else if(a==='round'){ S.round=v; S.err=''; save(); render(); }
  else if(a==='usename'){ S.name=cleanName(v); S.warn=''; S.err=''; save(); render(); }
  else if(a==='start'){
    var el=document.getElementById('name'); S.name=cleanName(el?el.value:S.name);
    if(!nkey(S.name)||!S.role||!S.round){ S.err=one('Isi nama Anda, pilih peran dan jenis pengisian.','Enter your name and pick your role and round.'); save(); render(); return; }
    if(S.round==='A'){ var bn=savedNames('B'); if(bn.length && !bn.some(function(n){ return nkey(n)===nkey(S.name); }) && S.warn!==nkey(S.name)){ S.warn=nkey(S.name); S.err=''; save(); render(); return; } }
    S.err=''; S.warn=''; S.answers=Array(NT).fill(0); S.step=0; S.plan=['','','']; S.reflect=['','','']; S.cmp=null; S.date=today(); OPEN={}; go('questions'); }
  else if(a==='resume'){ var f=S.answers.findIndex(function(x){return !x;}); S.step=f<0?0:Math.min(14,Math.floor(f/NI)); go('questions'); }
  else if(a==='ans'){ var i=+t.getAttribute('data-i'); S.answers[i]=+v; save(); var y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==='next'){ var b=NI*S.step; if(!(S.answers[b]&&S.answers[b+1])) return; if(S.step<14){ S.step++; save(); render(); window.scrollTo(0,0); } else finish(); }
  else if(a==='back'){ if(S.step>0){ S.step--; save(); render(); window.scrollTo(0,0); } else go('welcome'); }
  else if(a==='copy'){ copyFrom(t); }
  else if(a==='edit'){ S.step=0; go('questions'); }
  else if(a==='askreset'){ S.confirm=true; render(); }
  else if(a==='noreset'){ S.confirm=false; render(); }
  else if(a==='reset'){ var lang=S.lang; S=blank(); S.lang=lang; store.del(HKEY); go('welcome'); }
  else if(a==='gotoOpen'){ S.openErr=''; go('open'); }
  else if(a==='gotoWelcome'){ if(location.hash==='#facilitator') location.hash=''; go('welcome'); }
  else if(a==='gotoFac'){ location.hash='facilitator'; }
  else if(a==='doOpen'){ var d=decode(document.getElementById('opentext').value); S.openText=document.getElementById('opentext').value;
    if(!d.ok){ S.openErr=codeErr(d); render(); return; }
    S.name=d.name; S.role=d.role; S.round=d.round; S.date=d.date; S.answers=d.answers; S.cmp=null; S.openErr=''; S.openText=''; histSet(d.key+'|'+d.round, encode(S)); go('results'); }
  else if(a==='cmp'){ var tx=document.getElementById('cmptext').value; S.cmpText=tx; var d2=decode(tx);
    if(!d2.ok){ S.cmpMsg=codeErr(d2); }
    else if(d2.round!=='B'){ S.cmpMsg=one('Ini hasil Sesudah. Tempel hasil Sebelum.','That is an After result. Paste your Before result.'); }
    else { S.cmp=d2; S.cmpMsg=''; }
    render(); }
  else if(a==='facrole'){ FAC.text=document.getElementById('factext').value; FAC.alias=document.getElementById('facalias').value; FAC.roleLabels=v; if(FAC.res) FAC.res=parseCodes(FAC.text,FAC.alias); render(); }
  else if(a==='facrun'){ FAC.text=document.getElementById('factext').value; FAC.alias=document.getElementById('facalias').value; FAC.res=parseCodes(FAC.text,FAC.alias); render(); }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='name'){ S.name=t.value; save(); }
  else if(t.hasAttribute('data-plan')){ S.plan[+t.getAttribute('data-plan')]=t.value; save(); }
  else if(t.hasAttribute('data-ref')){ S.reflect[+t.getAttribute('data-ref')]=t.value; save(); }
});
document.addEventListener('toggle',function(e){ var t=e.target; if(t && t.getAttribute && t.getAttribute('data-d')!==null){ OPEN[t.getAttribute('data-d')]=t.open; } },true);
function route(){ if(location.hash==='#facilitator'){ S.screen='fac'; render(); } else if(S.screen==='fac'){ S.screen='welcome'; render(); } }
window.addEventListener('hashchange',route);
if(S.screen==='questions' && !S.name){ S.screen='welcome'; }
if(S.screen==='results' && answered(S.answers)<NT){ S.screen='welcome'; }
if(location.hash==='#facilitator') S.screen='fac';
render();
})();
</script>
